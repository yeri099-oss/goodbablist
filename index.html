<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>거래처 발주 관리</title>
<style>
  :root{
    --bg:#f4f6f8; --card:#ffffff; --line:#e3e8ee; --line2:#eef2f6;
    --txt:#1f2937; --sub:#6b7280; --brand:#2f855a; --brand-d:#276749;
    --brand-l:#e6f4ec; --danger:#c0392b; --danger-l:#fdecea;
    --shadow:0 8px 30px rgba(0,0,0,.14); --radius:12px;
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--bg); color:var(--txt);
    font-family:"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",
      -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    font-size:14px; line-height:1.5;
  }
  header{background:var(--brand); color:#fff; padding:16px 22px; display:flex; align-items:center;}
  header .ht h1{margin:0; font-size:18px; font-weight:700; letter-spacing:.2px;}
  header .ht p{margin:3px 0 0; font-size:12px; opacity:.85;}
  header .sync{margin-left:auto; display:flex; align-items:center; gap:12px;}
  header .dot{display:inline-flex; align-items:center; gap:6px; font-size:12px; opacity:.9;}
  header .dot i{width:8px; height:8px; border-radius:50%; background:#a7f3d0; display:inline-block;}
  header .dot.off i{background:#fca5a5;}
  header .logout{background:rgba(255,255,255,.16); color:#fff; border:none; border-radius:8px;
    padding:6px 12px; font-size:12px; cursor:pointer; font-weight:600;}
  header .logout:hover{background:rgba(255,255,255,.28);}
  .wrap{max-width:1180px; margin:0 auto; padding:0 16px 60px; display:none;}
  .wrap.on{display:block;}

  .tabs{display:flex; gap:4px; margin-top:14px; flex-wrap:wrap;}
  .tab{padding:10px 18px; background:transparent; border:none; cursor:pointer;
    font-size:14px; font-weight:600; color:var(--sub); border-radius:10px 10px 0 0;}
  .tab.active{color:var(--brand-d); background:var(--card); box-shadow:0 -2px 6px rgba(0,0,0,.04);}
  .tab.settings{margin-left:auto; color:#8a94a3;}
  .tab.active.settings{color:var(--brand-d);}

  .panel{background:var(--card); border-radius:0 0 var(--radius) var(--radius);
    box-shadow:0 4px 18px rgba(0,0,0,.05); padding:18px; min-height:340px;}

  .toolbar{display:flex; gap:10px; align-items:center; margin-bottom:14px; flex-wrap:wrap;}
  .toolbar .spacer{flex:1}
  .search{flex:0 1 260px; position:relative;}
  .search input{width:100%; padding:9px 12px 9px 34px; border:1px solid var(--line);
    border-radius:9px; font-size:13px; background:#fff;}
  .search svg{position:absolute; left:10px; top:9px; opacity:.4}
  .count{font-size:12px; color:var(--sub);}

  button.btn{border:none; border-radius:9px; padding:9px 14px; font-size:13px;
    font-weight:600; cursor:pointer; font-family:inherit;}
  .btn-primary{background:var(--brand); color:#fff;}
  .btn-primary:hover{background:var(--brand-d);}
  .btn-ghost{background:#eef2f6; color:#374151;}
  .btn-ghost:hover{background:#e2e8f0;}
  .btn-danger{background:var(--danger); color:#fff;}
  .btn-danger:hover{filter:brightness(.93);}
  .btn-line{background:#fff; color:#374151; border:1px solid var(--line);}
  .btn-line:hover{background:#f7f9fb;}

  table{width:100%; border-collapse:collapse;}
  th,td{text-align:left; padding:11px 12px; border-bottom:1px solid var(--line2); vertical-align:top;}
  thead th{position:sticky; top:0; background:#fafbfc; font-size:12.5px; color:#4b5563;
    font-weight:700; border-bottom:2px solid var(--line); user-select:none;}
  th.sortable{cursor:pointer; white-space:nowrap;}
  th.sortable:hover{color:var(--brand-d);}
  th .arrow{font-size:10px; margin-left:3px; color:var(--brand); opacity:.55;}
  th.act, td.act{width:118px; text-align:right; white-space:nowrap;}
  tbody tr{cursor:pointer;}
  tbody tr:hover{background:#f6fbf8;}
  td.pay .pill{display:inline-block; padding:2px 9px; border-radius:20px; font-size:11.5px; font-weight:700;}
  .pill.m{background:#e6f0fb; color:#2c5aa0;}
  .pill.i{background:#fdefe3; color:#b5651d;}
  td.vendor{font-weight:600;}
  td.items .il{display:block; color:#374151;}
  td.items .more{color:var(--sub); font-size:12px;}
  td .chip-o{display:inline-block; background:var(--brand-l); color:var(--brand-d);
    border-radius:14px; padding:2px 9px; font-size:11.5px; font-weight:600; margin:1px 3px 1px 0;}
  td .method-t{background:#f1f0fb; color:#5b4b9e; border-radius:6px; padding:2px 8px;
    font-size:12px; font-weight:600;}
  .empty{padding:60px 20px; text-align:center; color:var(--sub);}

  .row-btn{border:1px solid var(--line); background:#fff; border-radius:7px; padding:5px 9px;
    font-size:12px; cursor:pointer; margin-left:5px; font-weight:600; color:#374151;}
  .row-btn:hover{background:#f2f5f8;}
  .row-btn.del{color:var(--danger); border-color:#f1c9c4;}
  .row-btn.del:hover{background:var(--danger-l);}

  .overlay{position:fixed; inset:0; background:rgba(17,24,39,.45); display:none;
    align-items:center; justify-content:center; padding:20px; z-index:50;}
  .overlay.on{display:flex;}
  .modal{background:#fff; border-radius:16px; box-shadow:var(--shadow);
    width:100%; max-width:640px; max-height:90vh; overflow:auto;}
  .modal.sm{max-width:400px;}
  .modal-h{padding:18px 22px; border-bottom:1px solid var(--line2); display:flex; align-items:center; gap:10px;}
  .modal-h h2{margin:0; font-size:17px;}
  .modal-h .x{margin-left:auto; border:none; background:none; font-size:22px; cursor:pointer; color:#9aa4b2; line-height:1;}
  .modal-b{padding:20px 22px;}
  .modal-f{padding:14px 22px 20px; display:flex; gap:9px; justify-content:flex-end; border-top:1px solid var(--line2); flex-wrap:wrap;}

  .dv-title{font-size:20px; font-weight:700; margin:0 0 2px;}
  .dv-sub{color:var(--sub); font-size:12.5px; margin-bottom:16px;}
  .dv-grid{display:grid; grid-template-columns:110px 1fr; gap:10px 14px; align-items:start;}
  .dv-grid dt{color:var(--sub); font-size:12.5px; font-weight:600; padding-top:2px;}
  .dv-grid dd{margin:0; white-space:pre-wrap; word-break:break-word;}
  .dv-grid dd a{color:var(--brand-d);}
  .dv-grid .none{color:#b6bdc7;}
  .dv-sec{margin-top:16px; padding-top:14px; border-top:1px dashed var(--line);}
  .dv-sec h4{margin:0 0 10px; font-size:12px; color:var(--brand-d); letter-spacing:.4px;}

  .fld{margin-bottom:16px;}
  .fld > label{display:block; font-size:13px; font-weight:700; margin-bottom:6px;}
  .fld .req{color:var(--danger); margin-left:2px;}
  .fld input[type=text], .fld input[type=tel], .fld input[type=email],
  .fld input[type=password], .fld select, .fld textarea{
    width:100%; padding:9px 11px; border:1px solid var(--line); border-radius:9px;
    font-size:13.5px; font-family:inherit; background:#fff;}
  .fld input:focus,.fld select:focus,.fld textarea:focus{
    outline:none; border-color:var(--brand); box-shadow:0 0 0 3px var(--brand-l);}
  .fld textarea{resize:vertical; min-height:60px;}
  .sub-group{margin-top:9px; padding:12px; background:#f8fafb; border:1px solid var(--line2); border-radius:10px;}
  .sub-group .cap{font-size:11.5px; color:var(--sub); font-weight:600; margin-bottom:8px;}
  .sub-row{margin-bottom:9px;}
  .sub-row:last-child{margin-bottom:0;}
  .sub-row label{display:block; font-size:12px; color:#4b5563; margin-bottom:3px;}

  .item-row{display:flex; gap:6px; margin-bottom:6px; align-items:center;}
  .item-row input{flex:1;}
  .item-row .del-i{border:1px solid var(--line); background:#fff; border-radius:8px; width:34px; height:36px;
    cursor:pointer; color:#9aa4b2; font-size:16px; flex:none;}
  .item-row .del-i:hover{background:var(--danger-l); color:var(--danger);}
  .hint{font-size:11.5px; color:var(--sub); margin-top:5px;}

  .emp-chips{display:flex; flex-wrap:wrap; gap:7px;}
  .emp-chip{border:1px solid var(--line); background:#fff; border-radius:20px; padding:6px 13px;
    font-size:13px; cursor:pointer; user-select:none; font-weight:600; color:#4b5563;}
  .emp-chip.on{background:var(--brand); border-color:var(--brand); color:#fff;}
  .emp-chip:hover{border-color:var(--brand);}

  .set-box{max-width:480px;}
  .set-box h3{font-size:15px; margin:0 0 4px;}
  .set-box p.desc{color:var(--sub); font-size:12.5px; margin:0 0 16px;}
  .emp-list{list-style:none; padding:0; margin:0 0 14px;}
  .emp-list li{display:flex; align-items:center; gap:10px; padding:10px 12px; border:1px solid var(--line2);
    border-radius:9px; margin-bottom:7px; background:#fbfcfd;}
  .emp-list li span{flex:1; font-weight:600;}
  .emp-list li .rm{border:none; background:none; color:var(--danger); cursor:pointer; font-size:12.5px; font-weight:600;}
  .add-emp{display:flex; gap:8px;}
  .add-emp input{flex:1; padding:9px 11px; border:1px solid var(--line); border-radius:9px; font-size:13.5px; font-family:inherit;}
  .set-note{margin-top:24px; font-size:12px; color:var(--sub); background:#f8fafb; border:1px solid var(--line2);
    border-radius:9px; padding:12px 14px;}
  .set-seed{margin-top:22px; padding:16px; border:1px dashed var(--line); border-radius:10px; background:#fbfcfd;}
  .set-seed h4{margin:0 0 6px; font-size:14px;}
  .set-seed p{margin:0 0 12px; font-size:12.5px; color:var(--sub);}

  .toast{position:fixed; bottom:22px; left:50%; transform:translateX(-50%); background:#1f2937; color:#fff;
    padding:11px 18px; border-radius:10px; font-size:13px; box-shadow:var(--shadow); opacity:0;
    transition:opacity .25s, transform .25s; pointer-events:none; z-index:80; max-width:80vw; text-align:center;}
  .toast.on{opacity:1; transform:translateX(-50%) translateY(-4px);}
  .confirm-msg{font-size:15px; line-height:1.6; margin:4px 0 2px; font-weight:600;}
  .confirm-sub{color:var(--sub); font-size:13px; margin-top:6px;}

  /* login */
  #login{position:fixed; inset:0; display:none; align-items:center; justify-content:center;
    background:var(--bg); z-index:100; padding:20px;}
  #login.on{display:flex;}
  .login-card{background:#fff; border-radius:16px; box-shadow:var(--shadow); width:100%; max-width:360px; padding:30px 26px; text-align:center;}
  .login-card .logo{width:46px; height:46px; border-radius:12px; background:var(--brand-l); color:var(--brand-d);
    display:flex; align-items:center; justify-content:center; font-size:22px; margin:0 auto 14px;}
  .login-card h2{margin:0 0 4px; font-size:18px;}
  .login-card p{margin:0 0 20px; color:var(--sub); font-size:13px;}
  .login-card input{width:100%; padding:11px 13px; border:1px solid var(--line); border-radius:10px;
    font-size:15px; font-family:inherit; text-align:center; margin-bottom:12px;}
  .login-card input:focus{outline:none; border-color:var(--brand); box-shadow:0 0 0 3px var(--brand-l);}
  .login-card button{width:100%; padding:11px; border:none; border-radius:10px; background:var(--brand);
    color:#fff; font-size:15px; font-weight:700; cursor:pointer; font-family:inherit;}
  .login-card button:hover{background:var(--brand-d);}
  .login-card .err{color:var(--danger); font-size:12.5px; min-height:18px; margin-top:10px;}
  .cfg-warn{background:#fff8e1; border:1px solid #f7e08a; color:#7a5b00; border-radius:10px; padding:12px 14px;
    font-size:12.5px; text-align:left; margin-bottom:16px; line-height:1.5;}
</style>
</head>

const cfgMissing = JSON.stringify(firebaseConfig).includes("여기에");

/* ============================================================
   로그인 / 인증
   ============================================================ */
const $ = id => document.getElementById(id);

function initAuthGate(){
  if(cfgMissing){
    $("login").classList.add("on");
    $("cfgWarn").style.display = "block";
    $("cfgWarn").innerHTML = "⚠ 아직 Firebase 설정이 입력되지 않았습니다.<br>파일 상단의 <b>firebaseConfig</b> 와 <b>SHARED_EMAIL</b> 을 채운 뒤 다시 열어주세요. (설치 가이드 참고)";
    $("pw").disabled = true; $("loginBtn").disabled = true;
    return;
  }
  setPersistence(auth, browserLocalPersistence).catch(()=>{});
  onAuthStateChanged(auth, user=>{
    if(user){
      authed = true;
      $("login").classList.remove("on");
      $("wrap").classList.add("on");
      $("logoutBtn").style.display = "inline-block";
      if(!listenersStarted){ startListeners(); listenersStarted = true; }
      render();
    }else{
      authed = false;
      $("wrap").classList.remove("on");
      $("logoutBtn").style.display = "none";
      $("login").classList.add("on");
      setTimeout(()=> $("pw").focus(), 100);
    }
  });
}
async function doLogin(){
  const pw = $("pw").value;
  if(!pw){ $("pw").focus(); return; }
  $("loginErr").textContent = "";
  $("loginBtn").disabled = true; $("loginBtn").textContent = "확인 중…";
  try{
    await signInWithEmailAndPassword(auth, SHARED_EMAIL, pw);
    $("pw").value = "";
  }catch(e){
    $("loginErr").textContent = "비밀번호가 올바르지 않습니다.";
  }finally{
    $("loginBtn").disabled = false; $("loginBtn").textContent = "입력";
  }
}
$("loginBtn").onclick = doLogin;
$("pw").addEventListener("keydown", e=>{ if(e.key==="Enter") doLogin(); });
$("logoutBtn").onclick = ()=>{
  confirmDialog("로그아웃 하시겠습니까?", "", ()=> signOut(auth), "로그아웃");
};

/* ============================================================
   Firestore 실시간 구독 / 쓰기
   ============================================================ */
function setSync(ok, txt){
  const d = $("syncDot"); d.classList.toggle("off", !ok);
  $("syncTxt").textContent = txt;
}
function startListeners(){
  setSync(false, "동기화 중…");
  onSnapshot(collection(db,"vendors"), snap=>{
    const sites = {}; SITES.forEach(s=> sites[s]=[]);
    snap.forEach(docSnap=>{
      const r = { id:docSnap.id, ...docSnap.data() };
      if(!sites[r.site]) sites[r.site] = [];
      sites[r.site].push(r);
    });
    STATE.sites = sites;
    setSync(true, "실시간 연결됨");
    if(authed) render();
  }, err=>{ console.error(err); setSync(false, "연결 오류"); });

  onSnapshot(doc(db,"config","employees"), d=>{
    STATE.employees = (d.exists() && Array.isArray(d.data().list) && d.data().list.length)
      ? d.data().list : DEFAULT_EMP.slice();
    if(authed) render();
  });
}
async function fsAdd(data){ await addDoc(collection(db,"vendors"), { site: ui.site, ...data }); }
async function fsUpdate(id, data){ await updateDoc(doc(db,"vendors",id), data); }
async function fsDelete(id){ await deleteDoc(doc(db,"vendors",id)); }
async function fsSetEmployees(list){ await setDoc(doc(db,"config","employees"), { list }); }
async function fsSeed(){
  const existing = await getDocs(collection(db,"vendors"));
  if(!existing.empty) return { skipped:true, count:existing.size };
  const batch = writeBatch(db);
  SEED_DATA.forEach(r=>{
    const ref = doc(collection(db,"vendors"));
    batch.set(ref, { site:"꽃밥마켓", ...r });
  });
  await batch.commit();
  return { skipped:false, count:SEED_DATA.length };
}

/* ---------- utils ---------- */
function esc(s){ return String(s==null?"":s)
  .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function records(){ return STATE.sites[ui.site] || []; }
function byId(id){ return records().find(r=>r.id===id); }
function toast(msg){ const t=$("toast"); t.textContent=msg; t.classList.add("on");
  clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove("on"),2400); }
function sortVal(r,key){
  if(key==="items") return (r.items||[]).join(", ");
  if(key==="orderers") return (r.orderers||[]).join(", ");
  return r[key]||"";
}

   렌더링
   ============================================================ */
function renderTabs(){
  const el=$("tabs"); let h="";
  SITES.forEach(s=>{
    const n=(STATE.sites[s]||[]).length;
    h+=`<button class="tab ${ui.tab===s?'active':''}" data-tab="${s}">${s} <span style="opacity:.6;font-weight:500">(${n})</span></button>`;
  });
  h+=`<button class="tab settings ${ui.tab==='설정'?'active':''}" data-tab="설정">⚙ 설정</button>`;
  el.innerHTML=h;
  el.querySelectorAll(".tab").forEach(b=> b.onclick=()=>{
    ui.tab=b.dataset.tab;
    if(ui.tab!=="설정"){ ui.site=ui.tab; ui.q=""; }
    render();
  });
}
function render(){
  if(!authed) return;
  renderTabs();
  const panel=$("panel");
  if(ui.tab==="설정"){ panel.innerHTML=""; panel.appendChild(renderSettings()); return; }
  renderList(panel);
}
function renderList(panel){
  let list=records().slice();
  const q=ui.q.trim().toLowerCase();
  if(q){
    list=list.filter(r=>[r.vendor,(r.items||[]).join(" "),(r.orderers||[]).join(" "),
      r.orderMethod,r.payment,r.vendorContact,r.vendorPhone,r.note].join(" ").toLowerCase().includes(q));
  }
  if(ui.sortKey){
    list.sort((a,b)=> sortVal(a,ui.sortKey).localeCompare(sortVal(b,ui.sortKey),"ko")*ui.sortDir);
  }
  const arrow=k=> ui.sortKey===k?`<span class="arrow">${ui.sortDir>0?'▲':'▼'}</span>`:`<span class="arrow" style="opacity:.2">↕</span>`;
  let h=`
  <div class="toolbar">
    <button class="btn btn-primary" id="addBtn">+ 거래처 추가</button>
    <div class="search">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg>
      <input id="searchInput" type="text" placeholder="거래처·품목·발주자 검색" value="${esc(ui.q)}">
    </div>
    <span class="count">${list.length}개 거래처</span>
    <div class="spacer"></div>
    <button class="btn btn-line" id="exp1">⬇ 발주리스트 내보내기</button>
    <button class="btn btn-line" id="exp2">⬇ 업체별 형식 내보내기</button>
  </div>`;
  if(!records().length){
    h+=`<div class="empty">이 사업장에는 아직 거래처가 없습니다.<br>“+ 거래처 추가”로 시작하세요.</div>`;
    panel.innerHTML=h; wireToolbar(panel); return;
  }
  h+=`<table><thead><tr>
    <th class="sortable" data-k="payment">결제${arrow("payment")}</th>
    <th class="sortable" data-k="vendor">거래처${arrow("vendor")}</th>
    <th class="sortable" data-k="items">품목${arrow("items")}</th>
    <th class="sortable" data-k="orderMethod">발주방법${arrow("orderMethod")}</th>
    <th class="sortable" data-k="orderers">발주자${arrow("orderers")}</th>
    <th class="act">관리</th>
  </tr></thead><tbody>`;
  if(!list.length) h+=`<tr><td colspan="6" class="empty" style="padding:36px">검색 결과가 없습니다.</td></tr>`;
  list.forEach(r=>{
    const items=r.items||[];
    const itemsHtml=items.length
      ? items.slice(0,2).map(i=>`<span class="il">${esc(i)}</span>`).join("")+(items.length>2?`<span class="more">외 ${items.length-2}건</span>`:"")
      : `<span style="color:#b6bdc7">-</span>`;
    const orderersHtml=(r.orderers||[]).length
      ? r.orderers.map(o=>`<span class="chip-o">${esc(o)}</span>`).join("") : `<span style="color:#b6bdc7">-</span>`;
    const methodHtml=r.orderMethod?`<span class="method-t">${esc(r.orderMethod)}</span>`:`<span style="color:#b6bdc7">-</span>`;
    const payCls=r.payment==="즉시결제"?"i":"m";
    h+=`<tr data-id="${r.id}">
      <td class="pay">${r.payment?`<span class="pill ${payCls}">${esc(r.payment)}</span>`:`<span style="color:#b6bdc7">-</span>`}</td>
      <td class="vendor">${esc(r.vendor)}</td>
      <td class="items">${itemsHtml}</td>
      <td>${methodHtml}</td>
      <td>${orderersHtml}</td>
      <td class="act">
        <button class="row-btn edit" data-id="${r.id}">수정</button>
        <button class="row-btn del" data-id="${r.id}">삭제</button>
      </td></tr>`;
  });
  h+=`</tbody></table>`;
  panel.innerHTML=h;
  wireToolbar(panel);
  panel.querySelectorAll("th.sortable").forEach(th=> th.onclick=()=>{
    const k=th.dataset.k;
    if(ui.sortKey===k) ui.sortDir*=-1; else { ui.sortKey=k; ui.sortDir=1; }
    render();
  });
  panel.querySelectorAll("tbody tr[data-id]").forEach(tr=> tr.onclick=e=>{
    if(e.target.closest(".row-btn")) return; openDetail(tr.dataset.id);
  });
  panel.querySelectorAll(".row-btn.edit").forEach(b=> b.onclick=e=>{ e.stopPropagation(); askEdit(b.dataset.id); });
  panel.querySelectorAll(".row-btn.del").forEach(b=> b.onclick=e=>{ e.stopPropagation(); askDelete(b.dataset.id); });
}
function wireToolbar(panel){
  const add=panel.querySelector("#addBtn"); if(add) add.onclick=()=>openForm(null);
  const s=panel.querySelector("#searchInput");
  if(s) s.oninput=()=>{ ui.q=s.value; renderList($("panel"));
    const ns=$("panel").querySelector("#searchInput"); if(ns){ ns.focus(); ns.setSelectionRange(ns.value.length,ns.value.length);} };
  const e1=panel.querySelector("#exp1"); if(e1) e1.onclick=exportOrderList;
  const e2=panel.querySelector("#exp2"); if(e2) e2.onclick=exportUpche;
}

/* ---------- 상세 ---------- */
function detailField(label,val,isLink){
  if(!val||(Array.isArray(val)&&!val.length)) return `<dt>${label}</dt><dd class="none">-</dd>`;
  if(isLink){ const url=/^https?:\/\//.test(val)?val:("http://"+val);
    return `<dt>${label}</dt><dd><a href="${esc(url)}" target="_blank" rel="noopener">${esc(val)}</a></dd>`; }
  const v=Array.isArray(val)?val.map(esc).join(", "):esc(val);
  return `<dt>${label}</dt><dd>${v}</dd>`;
}
function openDetail(id){
  const r=byId(id); if(!r) return;
  const items=(r.items||[]).length?r.items.map(esc).join("<br>"):`<span class="none">-</span>`;
  const orderers=(r.orderers||[]).length?r.orderers.map(o=>`<span class="chip-o">${esc(o)}</span>`).join(" "):`<span class="none">-</span>`;
  const m=$("detailModal");
  m.innerHTML=`
    <div class="modal-h"><h2>거래처 상세</h2><button class="x" data-close>&times;</button></div>
    <div class="modal-b">
      <p class="dv-title">${esc(r.vendor)}</p>
      <p class="dv-sub">${esc(ui.site)} · ${r.payment?esc(r.payment):"결제방식 미지정"}</p>
      <dl class="dv-grid">
        <dt>결제</dt><dd>${r.payment?esc(r.payment):'<span class="none">-</span>'}</dd>
        <dt>품목</dt><dd>${items}</dd>
        <dt>발주방법</dt><dd>${r.orderMethod?esc(r.orderMethod):'<span class="none">-</span>'}</dd>
        <dt>발주자</dt><dd>${orderers}</dd>
      </dl>
      <div class="dv-sec"><h4>거래처 세부사항</h4><dl class="dv-grid">
        ${detailField("전화번호",r.vendorPhone)}
        ${detailField("담당자",r.vendorContact)}
        ${detailField("이메일",r.vendorEmail)}
      </dl></div>
      <div class="dv-sec"><h4>발주방법 유의사항</h4><dl class="dv-grid">
        ${detailField("발주일·마감",r.orderDay)}
        ${detailField("입고일",r.arrivalDay)}
        ${detailField("사이트",r.siteUrl,true)}
        ${detailField("유의사항/비고",r.note)}
      </dl></div>
    </div>
    <div class="modal-f">
      <button class="btn btn-danger" data-del>삭제</button>
      <button class="btn btn-primary" data-edit>수정</button>
      <button class="btn btn-ghost" data-close>닫기</button>
    </div>`;
  m.querySelectorAll("[data-close]").forEach(b=> b.onclick=()=>closeOverlay("ov-detail"));
  m.querySelector("[data-edit]").onclick=()=>{ closeOverlay("ov-detail"); askEdit(id); };
  m.querySelector("[data-del]").onclick=()=>{ closeOverlay("ov-detail"); askDelete(id); };
  openOverlay("ov-detail");
}

/* ---------- 추가/수정 ---------- */
function askEdit(id){ confirmDialog("수정하시겠습니까?","이 거래처 정보를 수정합니다.",()=>openForm(id),"수정"); }
function askDelete(id){
  const r=byId(id);
  confirmDialog("삭제하시겠습니까?",`‘${r?r.vendor:""}’ 거래처를 삭제합니다. 되돌릴 수 없습니다.`, async()=>{
    try{ await fsDelete(id); toast("삭제되었습니다."); }
    catch(e){ toast("삭제 실패: 네트워크를 확인하세요."); }
  },"삭제",true);
}
function openForm(id){
  const editing=!!id;
  const r=editing?byId(id):{payment:"월결제",vendor:"",vendorPhone:"",vendorContact:"",vendorEmail:"",
    items:[],orderMethod:"",orderDay:"",arrivalDay:"",siteUrl:"",note:"",orderers:[]};
  const items=(r.items&&r.items.length)?r.items.slice():[""];
  const emp=STATE.employees;
  const m=$("formModal");
  m.innerHTML=`
    <div class="modal-h"><h2>${editing?"거래처 수정":"거래처 추가"}</h2><button class="x" data-close>&times;</button></div>
    <div class="modal-b">
      <div class="fld"><label>결제</label>
        <select id="f-payment">${PAYMENTS.map(p=>`<option ${r.payment===p?"selected":""}>${p}</option>`).join("")}</select></div>
      <div class="fld"><label>거래처<span class="req">*</span></label>
        <input type="text" id="f-vendor" value="${esc(r.vendor)}" placeholder="거래처 이름" autocomplete="off">
        <div class="sub-group"><div class="cap">선택 세부사항</div>
          <div class="sub-row"><label>전화번호</label><input type="text" id="f-phone" value="${esc(r.vendorPhone)}" placeholder="예: 010-0000-0000"></div>
          <div class="sub-row"><label>담당자</label><input type="text" id="f-contact" value="${esc(r.vendorContact)}" placeholder="예: 홍길동 대표"></div>
          <div class="sub-row"><label>이메일</label><input type="text" id="f-email" value="${esc(r.vendorEmail)}" placeholder="예: name@example.com"></div>
        </div></div>
      <div class="fld"><label>품목</label><div id="itemList"></div>
        <div class="hint">엔터를 누르면 아래에 입력칸이 하나 더 생깁니다.</div></div>
      <div class="fld"><label>발주방법</label>
        <select id="f-method"><option value="" ${!r.orderMethod?"selected":""}>선택 안 함</option>
          ${METHODS.map(x=>`<option ${r.orderMethod===x?"selected":""}>${x}</option>`).join("")}</select>
        <div class="sub-group"><div class="cap">선택 세부사항 (구체적 발주방법·유의사항)</div>
          <div class="sub-row"><label>발주일 및 마감시간</label><input type="text" id="f-orderday" value="${esc(r.orderDay)}" placeholder="예: 월/수/금 12시"></div>
          <div class="sub-row"><label>입고일</label><input type="text" id="f-arrival" value="${esc(r.arrivalDay)}" placeholder="예: D+1"></div>
          <div class="sub-row"><label>사이트</label><input type="text" id="f-site" value="${esc(r.siteUrl)}" placeholder="예: https://..."></div>
          <div class="sub-row"><label>유의사항 / 비고</label><textarea id="f-note" placeholder="구체적 발주방법, 주의사항 등">${esc(r.note)}</textarea></div>
        </div></div>
      <div class="fld"><label>발주자 <span style="font-weight:500;color:var(--sub);font-size:12px">(복수 선택 가능)</span></label>
        <div class="emp-chips" id="empChips">
          ${emp.map(e=>`<span class="emp-chip ${(r.orderers||[]).includes(e)?"on":""}" data-e="${esc(e)}">${esc(e)}</span>`).join("")}
        </div>
        <div class="hint">발주자 추가는 상단 <b>⚙ 설정</b> 탭에서 할 수 있습니다.</div></div>
    </div>
    <div class="modal-f">
      <button class="btn btn-ghost" data-close>취소</button>
      <button class="btn btn-primary" id="saveBtn">${editing?"수정 저장":"추가"}</button>
    </div>`;
  const itemList=m.querySelector("#itemList");
  function addItemRow(val,focus){
    const row=document.createElement("div"); row.className="item-row";
    row.innerHTML=`<input type="text" value="${esc(val||"")}" placeholder="품목 입력"><button type="button" class="del-i" title="삭제">&times;</button>`;
    const inp=row.querySelector("input");
    inp.addEventListener("keydown",ev=>{ if(ev.key==="Enter"){ ev.preventDefault(); addItemRow("",true); } });
    row.querySelector(".del-i").onclick=()=>{ if(itemList.children.length>1) row.remove(); else inp.value=""; };
    itemList.appendChild(row); if(focus) inp.focus();
  }
  items.forEach(v=>addItemRow(v,false));
  m.querySelectorAll(".emp-chip").forEach(c=> c.onclick=()=>c.classList.toggle("on"));
  m.querySelectorAll("[data-close]").forEach(b=> b.onclick=()=>closeOverlay("ov-form"));
  m.querySelector("#saveBtn").onclick=()=>saveForm(editing,id);
  openOverlay("ov-form");
  setTimeout(()=>m.querySelector("#f-vendor").focus(),60);
}
async function saveForm(editing,id){
  const m=$("formModal");
  const vendor=m.querySelector("#f-vendor").value.trim();
  if(!vendor){ toast("거래처 이름을 입력하세요."); m.querySelector("#f-vendor").focus(); return; }
  const data={
    payment:m.querySelector("#f-payment").value,
    vendor,
    vendorPhone:m.querySelector("#f-phone").value.trim(),
    vendorContact:m.querySelector("#f-contact").value.trim(),
    vendorEmail:m.querySelector("#f-email").value.trim(),
    items:[...m.querySelectorAll("#itemList input")].map(i=>i.value.trim()).filter(Boolean),
    orderMethod:m.querySelector("#f-method").value,
    orderDay:m.querySelector("#f-orderday").value.trim(),
    arrivalDay:m.querySelector("#f-arrival").value.trim(),
    siteUrl:m.querySelector("#f-site").value.trim(),
    note:m.querySelector("#f-note").value.trim(),
    orderers:[...m.querySelectorAll(".emp-chip.on")].map(c=>c.dataset.e)
  };
  const btn=m.querySelector("#saveBtn"); btn.disabled=true; btn.textContent="저장 중…";
  try{
    if(editing){ await fsUpdate(id,data); toast("수정되었습니다."); }
    else{ await fsAdd(data); toast("추가되었습니다."); }
    closeOverlay("ov-form");
  }catch(e){ console.error(e); toast("저장 실패: 네트워크를 확인하세요."); btn.disabled=false; btn.textContent=editing?"수정 저장":"추가"; }
}

/* ---------- 설정 ---------- */
function renderSettings(){
  const wrap=document.createElement("div"); wrap.className="set-box";
  function draw(){
    wrap.innerHTML=`
      <h3>발주자 관리</h3>
      <p class="desc">여기에 추가한 직원이 거래처 등록 시 발주자로 선택됩니다. (모두에게 실시간 공유)</p>
      <ul class="emp-list">
        ${STATE.employees.map(e=>`<li><span>${esc(e)}</span><button class="rm" data-e="${esc(e)}">삭제</button></li>`).join("")}
      </ul>
      <div class="add-emp"><input type="text" id="newEmp" placeholder="새 발주자 이름" autocomplete="off">
        <button class="btn btn-primary" id="addEmp">추가</button></div>

      <div class="set-seed">
        <h4>초기 데이터 올리기</h4>
        <p>‘업체별 발주방법’ 89개 거래처를 <b>꽃밥마켓</b>에 한 번만 업로드합니다.<br>이미 데이터가 있으면 실행되지 않습니다(중복 방지).</p>
        <button class="btn btn-line" id="seedBtn">업체별 89개 올리기</button>
      </div>
      <div class="set-note">
        · 발주자를 삭제해도 기존 거래처에 이미 지정된 발주자 표시는 유지됩니다.<br>
        · 모든 데이터는 클라우드(Firestore)에 저장되어 접속한 모두에게 실시간 반영됩니다.
      </div>`;
    wrap.querySelectorAll(".rm").forEach(b=> b.onclick=()=>{
      confirmDialog("삭제하시겠습니까?",`발주자 ‘${b.dataset.e}’ 를 목록에서 삭제합니다.`, async()=>{
        try{ await fsSetEmployees(STATE.employees.filter(x=>x!==b.dataset.e)); }
        catch(e){ toast("실패: 네트워크를 확인하세요."); }
      },"삭제",true);
    });
    const inp=wrap.querySelector("#newEmp");
    const add=async()=>{
      const v=inp.value.trim(); if(!v){ inp.focus(); return; }
      if(STATE.employees.includes(v)){ toast("이미 있는 발주자입니다."); return; }
      try{ await fsSetEmployees([...STATE.employees, v]); toast("발주자가 추가되었습니다."); inp.value=""; }
      catch(e){ toast("실패: 네트워크를 확인하세요."); }
    };
    wrap.querySelector("#addEmp").onclick=add;
    inp.addEventListener("keydown",e=>{ if(e.key==="Enter"){ e.preventDefault(); add(); } });
    wrap.querySelector("#seedBtn").onclick=()=>{
      confirmDialog("초기 데이터를 올릴까요?","업체별 89개 거래처를 꽃밥마켓에 업로드합니다.", async()=>{
        const btn=wrap.querySelector("#seedBtn"); btn.disabled=true; btn.textContent="업로드 중…";
        try{
          const res=await fsSeed();
          if(res.skipped) toast(`이미 ${res.count}개 데이터가 있어 건너뛰었습니다.`);
          else toast(`${res.count}개 거래처를 올렸습니다.`);
        }catch(e){ console.error(e); toast("업로드 실패: 네트워크를 확인하세요."); }
        btn.disabled=false; btn.textContent="업체별 89개 올리기";
      },"올리기");
    };
  }
  draw(); return wrap;
}

/* ---------- 확인 다이얼로그 ---------- */
function confirmDialog(title,sub,onYes,yesLabel,danger){
  const m=$("confirmModal");
  m.innerHTML=`
    <div class="modal-b" style="padding:24px 22px 8px">
      <p class="confirm-msg">${esc(title)}</p>${sub?`<p class="confirm-sub">${esc(sub)}</p>`:""}
    </div>
    <div class="modal-f">
      <button class="btn btn-ghost" data-no>아니오</button>
      <button class="btn ${danger?"btn-danger":"btn-primary"}" data-yes>${esc(yesLabel||"예")}</button>
    </div>`;
  m.querySelector("[data-no]").onclick=()=>closeOverlay("ov-confirm");
  m.querySelector("[data-yes]").onclick=()=>{ closeOverlay("ov-confirm"); onYes(); };
  openOverlay("ov-confirm");
}
function openOverlay(id){ $(id).classList.add("on"); }
function closeOverlay(id){ $(id).classList.remove("on"); }
document.querySelectorAll(".overlay").forEach(o=> o.addEventListener("mousedown",e=>{ if(e.target===o) o.classList.remove("on"); }));
document.addEventListener("keydown",e=>{ if(e.key==="Escape") document.querySelectorAll(".overlay.on").forEach(o=>o.classList.remove("on")); });

/* ============================================================
   엑셀 내보내기 (자체 XLSX 생성기 · 외부 라이브러리 불필요)
   ============================================================ */
function exportOrderList(){
  const rows=[["결제","거래처","품목","발주방법","발주자"]];
  records().forEach(r=> rows.push([r.payment||"",r.vendor||"",(r.items||[]).join(", "),r.orderMethod||"",(r.orderers||[]).join(", ")]));
  downloadXlsx([{name:ui.site,rows}], `${ui.site}_발주리스트.xlsx`); toast("발주리스트 형식으로 내보냈습니다.");
}
function exportUpche(){
  const rows=[["업체명","주요상품","발주일 및 마감시간","입고일","발주방식","담당자","전화번호","이메일","사이트","비고"]];
  records().forEach(r=> rows.push([r.vendor||"",(r.items||[]).join(", "),r.orderDay||"",r.arrivalDay||"",r.orderMethod||"",r.vendorContact||"",r.vendorPhone||"",r.vendorEmail||"",r.siteUrl||"",r.note||""]));
  downloadXlsx([{name:"업체별",rows}], `${ui.site}_업체별발주방법.xlsx`); toast("업체별 형식으로 내보냈습니다.");
}
function downloadXlsx(sheets,filename){
  const blob=buildXlsx(sheets); const url=URL.createObjectURL(blob);
  const a=document.createElement("a"); a.href=url; a.download=filename;
  document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(url); a.remove(); },500);
}
function colName(n){ let s=""; n=n+1; while(n>0){ const m=(n-1)%26; s=String.fromCharCode(65+m)+s; n=Math.floor((n-1)/26); } return s; }
function xmlEsc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&apos;"); }
function sheetXml(rows){
  let x='<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetData>';
  rows.forEach((row,ri)=>{ x+=`<row r="${ri+1}">`;
    row.forEach((cell,ci)=>{ x+=`<c r="${colName(ci)+(ri+1)}" t="inlineStr"><is><t xml:space="preserve">${xmlEsc(cell)}</t></is></c>`; });
    x+='</row>'; });
  return x+'</sheetData></worksheet>';
}
function buildXlsx(sheets){
  const files=[];
  files.push(["[Content_Types].xml",'<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>'+sheets.map((s,i)=>`<Override PartName="/xl/worksheets/sheet${i+1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join("")+'</Types>']);
  files.push(["_rels/.rels",'<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>']);
  files.push(["xl/workbook.xml",'<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>'+sheets.map((s,i)=>`<sheet name="${xmlEsc(s.name).slice(0,31)}" sheetId="${i+1}" r:id="rId${i+1}"/>`).join("")+'</sheets></workbook>']);
  files.push(["xl/_rels/workbook.xml.rels",'<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'+sheets.map((s,i)=>`<Relationship Id="rId${i+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i+1}.xml"/>`).join("")+'</Relationships>']);
  sheets.forEach((s,i)=> files.push([`xl/worksheets/sheet${i+1}.xml`, sheetXml(s.rows)]));
  return zipStore(files);
}
const CRC_TABLE=(()=>{ const t=new Uint32Array(256); for(let n=0;n<256;n++){ let c=n; for(let k=0;k<8;k++) c=(c&1)?(0xEDB88320^(c>>>1)):(c>>>1); t[n]=c>>>0; } return t; })();
function crc32(b){ let c=0xFFFFFFFF; for(let i=0;i<b.length;i++) c=CRC_TABLE[(c^b[i])&0xFF]^(c>>>8); return (c^0xFFFFFFFF)>>>0; }
function zipStore(files){
  const enc=new TextEncoder(); const parts=[]; const central=[]; let offset=0;
  const u16=v=>[v&0xff,(v>>8)&0xff]; const u32=v=>[v&0xff,(v>>8)&0xff,(v>>16)&0xff,(v>>24)&0xff];
  files.forEach(([name,content])=>{
    const nameB=enc.encode(name), data=enc.encode(content), crc=crc32(data);
    const local=new Uint8Array([].concat(u32(0x04034b50),u16(20),u16(0),u16(0),u16(0),u16(0),u32(crc),u32(data.length),u32(data.length),u16(nameB.length),u16(0)));
    parts.push(local,nameB,data);
    central.push({head:new Uint8Array([].concat(u32(0x02014b50),u16(20),u16(20),u16(0),u16(0),u16(0),u16(0),u32(crc),u32(data.length),u32(data.length),u16(nameB.length),u16(0),u16(0),u16(0),u16(0),u32(0),u32(offset))),nameB});
    offset+=local.length+nameB.length+data.length;
  });
  const cdStart=offset; let cdSize=0;
  central.forEach(c=>{ parts.push(c.head,c.nameB); cdSize+=c.head.length+c.nameB.length; });
  parts.push(new Uint8Array([].concat(u32(0x06054b50),u16(0),u16(0),u16(files.length),u16(files.length),u32(cdSize),u32(cdStart),u16(0))));
  return new Blob(parts,{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
}
